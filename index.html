  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#F2F5F9; --ink:#121C27; --muted:#5A6878; --line:#D3DCE7;
  --pitch:#1474D4; --pitch-soft:#E0EDFB; --kit:#D3263B; --kit-soft:#FBE1E4;
  --gold:#B97800; --gold-soft:#FBEFD3; --off:#7A8590; --off-soft:#E6EAF0;
  --navy:#12558A; --on-navy:#FFFFFF; --lime:#D2EC2C;
  --shadow:0 1px 2px rgba(18,40,70,.06),0 0 0 1px rgba(18,40,70,.05);
  color-scheme:light;
  --f-round:"Jua","Kakao Small Sans",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  --f-display:var(--f-round);
  --f-body:var(--f-round);
}

:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}

.crest.lg{width:88px;height:88px}
.brand h1 .w{color:var(--pitch)}
.team-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.team-hero b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--pitch);line-height:1.15}
.team-hero span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.brand{min-width:0;flex:1}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.01em;line-height:1.1}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:400;padding:3px 8px;border-radius:999px;background:var(--pitch-soft);color:var(--pitch);white-space:nowrap}
.pill.ro{background:var(--off-soft);color:var(--off)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:400;background:var(--off-soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--pitch);color:var(--on-navy)}
.btn.danger{background:var(--kit-soft);color:var(--kit)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.section-title{font-family:var(--f-display);font-weight:400;font-size:18px;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.next{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;box-shadow:var(--shadow)}
.next .dd{font-family:var(--f-display);font-size:22px;line-height:1;color:var(--lime);min-width:52px;text-align:center;padding-right:12px;border-right:1px solid rgba(255,255,255,.2)}
.next .tx{min-width:0}
.next h2{margin:0 0 2px;font-size:15px;font-weight:400;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .meta{font-size:12px;opacity:.85;display:flex;flex-wrap:wrap;gap:0 10px;line-height:1.4}
.next button{background:var(--on-navy);color:var(--navy);white-space:nowrap}
.next.empty{grid-template-columns:minmax(0,1fr)}
.next.empty .dd{color:var(--on-navy);font-size:15px;border:0;text-align:left;padding:0}
.cal{background:#FFFFFF;border:1px solid var(--line);border-radius:18px;padding:8px 8px 6px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 6px}
.cal-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px 2px}
.dow{font-size:11px;font-weight:400;text-align:center;color:var(--muted);padding-bottom:2px}
.dow.sat{color:var(--pitch)}
.dow.sun,.day.sun .n i{color:var(--kit)}
.day{position:relative;border:0;background:transparent;border-radius:10px;min-height:44px;padding:3px 0 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px}
/* 날짜 숫자: 원 안 정중앙 — 글자 상하 여백을 잘라 숫자 몸통 기준으로 가운데 맞춤 */
.day .n{position:relative;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:14px;line-height:1;font-variant-numeric:tabular-nums}
.day .n i{position:relative;z-index:1;font-style:normal;display:block;line-height:1;text-box:trim-both cap alphabetic}
@supports not (text-box:trim-both cap alphabetic){.day .n i{transform:translateY(.07em)}}
.day.today .n{background:var(--navy)}
.day.today .n i{color:var(--on-navy)!important}
.day .dball{display:block;width:16px;height:16px;flex:none}
.day .dball .ball{display:block;width:100%;height:100%}

.day .more{position:absolute;top:2px;right:3px;font-size:10px;color:var(--muted);font-style:normal}
.bwrap{display:block;color:var(--bc,var(--c))}
.bwrap.t-class{--bc:#0F62D6}.bwrap.t-match{--bc:#E01B2F}.bwrap.t-personal{--bc:#7A35E8}.bwrap.gray{--bc:#7C8794}
.bwrap .ball{display:block;width:100%;height:100%}
.bwrap.t-class.gray,.bwrap.gray{color:var(--off)}
.bwrap.lg{width:16px;height:16px;flex:none}
.day.other{opacity:.35}
.day.sel{box-shadow:inset 0 0 0 2px var(--pitch)}
.day.sel:not([class*="ev-"]){background:var(--pitch-soft)}
/* 일정 있는 날: 칸 전체를 종류 색으로 연하게, 숫자 밑에 ⚽ */
.day.ev-class{background:color-mix(in srgb,#0F62D6 11%,transparent)}
.day.ev-match{background:color-mix(in srgb,#E01B2F 11%,transparent)}
.day.ev-match .n i{color:#E01B2F}
.day.ev-personal{background:color-mix(in srgb,#7A35E8 11%,transparent)}
.day.ev-gray{background:color-mix(in srgb,#7C8794 13%,transparent)}

.legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}
.day.sel .n i{color:var(--pitch)}
.dayhead{scroll-margin-top:calc(76px + env(safe-area-inset-top,0px));padding:4px 6px;margin-inline:-6px}
.dayhead.flash{animation:fl 1s ease-out}
@keyframes fl{from{background:var(--pitch-soft)}to{background:transparent}}
@media (prefers-reduced-motion: reduce){.dayhead.flash{animation:none}}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
.t-match{--c:var(--kit);--cs:var(--kit-soft)} .t-class{--c:var(--pitch);--cs:var(--pitch-soft)} .t-event{--c:var(--gold);--cs:var(--gold-soft)} .t-off{--c:var(--off);--cs:var(--off-soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);padding:6px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.list{display:flex;flex-direction:column;gap:8px}
.ev{width:100%;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.ev .when{text-align:center;border-right:2px solid var(--c);padding-right:10px}
.ev .when b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.ev .when small{font-size:11px;color:var(--muted)}
.ev .body{min-width:0}
.ev .body strong{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .body span{font-size:12.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.cancel .body strong{text-decoration:line-through;color:var(--muted)}
.chip{font-size:11px;font-weight:400;padding:3px 8px;border-radius:999px;background:var(--cs);color:var(--c);white-space:nowrap}
.empty-box{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
nav.tabs button.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:400;color:var(--muted);padding:6px 0}
nav.tabs button.tab svg{width:22px;height:22px}
nav.tabs button.tab[aria-current="page"]{color:var(--pitch)}
.fab{width:54px;height:54px;border-radius:50%;border:0;background:var(--pitch);color:var(--on-navy);font-size:28px;line-height:1;justify-self:center;margin-top:-26px;box-shadow:var(--shadow)}
.fab.off{visibility:hidden}
/* 상세 창은 CI·'수지위너스 캘린더' 머리글 바로 아래에서 열린다 (머리글은 가리지 않음) */
.overlay{position:fixed;left:0;right:0;bottom:0;top:calc(68px + env(safe-area-inset-top,0px));z-index:20;background:rgba(10,20,14,.5);display:flex;align-items:flex-end;justify-content:center}
body:has(.overlay) header.top{z-index:21}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:100%;overflow:auto;border-radius:22px 22px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet h2{margin:6px 0 2px;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2;text-wrap:balance}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-top:10px}
.card h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:400}
.kv{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.times{display:grid;gap:8px;margin-top:12px}
.times div{background:var(--surface);border-radius:14px;padding:10px;text-align:center}
.times small{display:block;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em}
.times b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.links a{font-size:13px;font-weight:400;color:var(--pitch);text-decoration:none;background:var(--pitch-soft);padding:6px 10px;border-radius:10px}
.check{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.check:last-of-type{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--pitch);flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.bar{height:6px;background:var(--off-soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--pitch);border-radius:3px}
.duty{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.duty:last-child{border-bottom:0}
.duty .role{font-size:12px;font-weight:400;background:var(--gold-soft);color:var(--gold);padding:3px 8px;border-radius:8px;flex:none}
.duty .who{font-weight:400}
.duty small{color:var(--muted);display:block;font-size:12.5px}
.duty.mine{background:var(--kit-soft);margin:0 -14px;padding:8px 14px}
.duty.mine .who::after{content:" · 우리 아이";color:var(--kit);font-size:12px}
.mt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mt td{padding:8px 4px;border-bottom:1px solid var(--line)}
.mt tr:last-child td{border-bottom:0}
.mt .tm{font-weight:400;width:52px}
.mt .fd{color:var(--muted);font-size:12.5px;width:76px}
.mt .sc{text-align:right;font-weight:400;color:var(--pitch)}
.notes{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.field textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 8px}
.hint{font-size:12px;color:var(--muted)}
.paste{background:var(--gold-soft);border-radius:16px;padding:12px;margin-top:6px}
.paste p{margin:0 0 6px;font-size:13px;color:var(--ink)}
.paste textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.types label{display:block;position:relative}
.types input{position:absolute;opacity:0;pointer-events:none}
.types span{display:block;text-align:center;font-size:13px;font-weight:400;padding:9px 0;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.types input:checked + span{background:var(--cs);border-color:var(--c);color:var(--c)}
.types input:focus-visible + span{outline:2px solid var(--pitch)}
.confirm{background:var(--kit-soft);border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.confirm div{display:flex;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.copybox{width:100%;min-height:220px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);font-size:13px}

/* roles, personal events, roster */
:root{--violet:#7A4FD6;--violet-soft:#EEE7FB}
.t-personal{--c:var(--violet);--cs:var(--violet-soft)}
.pill.role-admin{background:var(--navy);color:var(--on-navy)}
.pill.role-director,.pill.role-coach{background:var(--pitch-soft);color:var(--pitch)}
.pill.role-parent,.pill.role-player{background:var(--off-soft);color:var(--ink)}
.loading{background:var(--surface);border-radius:16px;padding:18px;color:var(--muted);font-size:14px;text-align:center}
.notice{background:var(--gold-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice b{font-family:var(--f-display);font-weight:400;font-size:18px}
.choice small{color:var(--muted);font-size:12.5px}
.choice button:disabled{opacity:.45}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.player{background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;border:0;text-align:left;width:100%}
.player .num{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.player div{min-width:0}
.player strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player small{display:block;color:var(--muted);font-size:12px}
.player.mine{outline:2px solid var(--kit)}
.member{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member .nm{flex:1;min-width:0}
.member .nm strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .nm small{color:var(--muted);font-size:12px}
.member select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;max-width:110px}
.perm{width:100%;border-collapse:collapse;font-size:13px}
.perm th,.perm td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}
.perm th:first-child,.perm td:first-child{text-align:left}
.perm thead th{color:var(--muted);font-size:11.5px;font-weight:400}
.perm .y{color:var(--pitch);font-weight:400}
.perm .p{color:var(--violet);font-weight:400}
.perm .n{color:var(--muted)}
.perm tr.me td{background:var(--pitch-soft)}
.hits{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hits button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.hits button[aria-pressed="true"]{border-color:var(--pitch);background:var(--pitch-soft)}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline .field{flex:1}
header.top{justify-content:flex-start;align-items:center}
header.top .brand{flex:1;min-width:0;display:flex;align-items:center;height:44px}
header.top .brand h1{font-size:24px;line-height:1;white-space:nowrap;margin:0}
.role-slot{flex:none;display:flex;align-items:center}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;margin-right:8px;padding:0;transition:background .2s,border-color .2s}
.bell svg{width:20px;height:20px;display:block}
.bell.hot{background:var(--lime);border-color:var(--lime);color:var(--navy);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 35%,transparent)}
.bell.hot svg{animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}92%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){.bell.hot svg{animation:none}}
.badge{border:2px solid var(--surface)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--kit);color:var(--on-navy);font-size:11px;font-weight:400;display:grid;place-items:center}
.nbanner{width:100%;border:0;border-radius:14px;background:var(--kit-soft);color:var(--kit);font-weight:400;padding:12px 14px;text-align:left;margin-bottom:10px}
.scope{margin:0 0 10px;font-size:13px;color:var(--muted)}
.gcard{background:var(--surface);border-radius:18px;padding:12px;margin-top:10px}
.gcard .roster .player{background:var(--bg)}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ghead b{font-family:var(--f-display);font-weight:400;font-size:18px;flex:1;min-width:0}
.iconbtn.sm{width:30px;height:30px;font-size:14px}
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick label{position:relative}
.gpick input{position:absolute;opacity:0;pointer-events:none}
.gpick span{display:block;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:400;color:var(--muted)}
.gpick input:checked + span{border-color:var(--pitch);background:var(--pitch-soft);color:var(--pitch)}
.gpick input:focus-visible + span{outline:2px solid var(--pitch)}
.rsvp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rsvp button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font-weight:400;color:var(--muted)}
.rsvp button[aria-pressed="true"].r-yes{background:var(--pitch-soft);border-color:var(--pitch);color:var(--pitch)}
.rsvp button[aria-pressed="true"].r-no{background:var(--kit-soft);border-color:var(--kit);color:var(--kit)}
.rsvp button[aria-pressed="true"].r-maybe{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.rsum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rsum span{font-size:12px;font-weight:400;padding:4px 9px;border-radius:999px;background:var(--off-soft)}
.rsum .r-yes,.rrow .r-yes{color:var(--pitch)} .rsum .r-no,.rrow .r-no{color:var(--kit)} .rsum .r-maybe,.rrow .r-maybe{color:var(--gold)} .rsum .r-none,.rrow .r-none{color:var(--muted)}
.rlist{display:flex;flex-direction:column}
.rrow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rrow:last-child{border-bottom:0}
.ev.unread{box-shadow:inset 3px 0 0 var(--kit),0 1px 0 var(--line)}
.mark{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-weight:400;font-size:13px}
.mark.r-yes{color:var(--pitch);border-color:var(--pitch)} .mark.r-no{color:var(--kit);border-color:var(--kit)} .mark.r-maybe{color:var(--gold);border-color:var(--gold)} .mark.r-none{color:var(--muted)}
.rrow{align-items:center}
.staffbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.staffbox h4{margin:0 0 6px}
.sec{background:var(--surface);border-radius:16px;padding:12px 14px 14px;margin-top:10px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--ink)}
.sec h3 svg{width:20px;height:20px;flex:none;color:var(--pitch)}
.sec-sub{margin-left:auto;font-size:12.5px;color:var(--muted);font-family:var(--f-body)}
.sec-line{margin:0;font-size:14.5px}
.sec .times{margin-top:8px}
.sec .times div{background:var(--bg)}
.kits{display:flex;flex-wrap:wrap;gap:8px}
.kit{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px 12px 6px 8px}
.kit svg{width:30px;height:30px;flex:none}
.kit b{font-weight:400;font-size:14px}
.notes2{font-size:14px;line-height:1.55}
.notes2 p{margin:0}
.notes2 .nh{font-family:var(--f-display);color:var(--pitch);margin:2px 0 4px}
.notes2 .li{display:flex;gap:6px}
.notes2 .bu{flex:none;min-width:1em;text-align:center}
.notes2 .lt{flex:1;min-width:0;overflow-wrap:anywhere}
.notes2 .gap{height:8px}
.ask{margin:0 0 8px;font-size:13px;color:var(--kit)}
.rsvp.pending button{border-style:dashed;border-color:var(--muted);color:var(--ink)}
.rsvp.answered button[aria-pressed="false"]{opacity:.55}
.rsvp button[aria-pressed="true"]{color:var(--on-navy)!important}
.rsvp button[aria-pressed="true"].r-yes{background:var(--pitch)!important;border-color:var(--pitch)}
.rsvp button[aria-pressed="true"].r-no{background:var(--kit)!important;border-color:var(--kit)}
.rsvp button[aria-pressed="true"].r-maybe{background:var(--gold)!important;border-color:var(--gold)}
.gpick label{display:inline-flex}
.gpick span{white-space:nowrap}
/* 흰 바탕에서 영역이 또렷하게: 카드마다 테두리 + 아주 옅은 그림자, 카드 안 작은 블록은 연회색 */
.card,.sec,.ev,.gcard,.cal,.loading,.empty-box,.player,.choice button{border:1px solid var(--line);box-shadow:0 1px 3px rgba(18,40,70,.06)}
.empty-box{border-style:dashed;box-shadow:none}
.sec h3{border-bottom:2px solid var(--pitch-soft)}
.sec .times div,.kit,.gcard .roster .player,.times div{background:var(--tint);border:0;box-shadow:none}
.section-title{padding-left:10px;border-left:4px solid var(--pitch);line-height:1.2}
.dayhead.section-title{border-left-color:var(--pitch)}
nav.tabs{background:#FFFFFF;box-shadow:0 -2px 10px rgba(18,40,70,.06)}
header.top{border-bottom:1px solid var(--line);margin-bottom:10px}
.member{border-bottom-color:var(--line)}
/* 달력 일정 표시: 앱의 다른 아이콘과 같은 선 아이콘 공 (종류 색) */
.day .emo{display:block;width:14px;height:14px;color:var(--ec,currentColor)}
.day .emo svg{display:block;width:100%;height:100%}
.day.ev-class{--ec:#0F62D6}.day.ev-match{--ec:#E01B2F}.day.ev-personal{--ec:#7A35E8}.day.ev-gray{--ec:#7C8794}
.day.ev-gray .emo{filter:none;opacity:1}
/* ===== 달력: 날아라 아유 보드 / 오늘도 도아 킥과 같은 구성 ===== */
.cal{background:#FFFFFF;border:2px solid var(--pitch);border-radius:14px;padding:11px 13px 12px;box-shadow:0 1px 2px rgba(18,85,138,.1)}
.cal-head{padding:0 0 8px}
.dows{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:6px}
.dow{padding-bottom:0}
.grid{gap:1px;background:#CFE0F5;border:1px solid #CFE0F5;border-radius:14px;overflow:hidden}
.day{background:#FFFFFF;border-radius:0;min-height:44px;height:44px;padding:2px 1px;gap:1px;justify-content:center;box-shadow:none}
.day.other{opacity:1;background:#FAFCFE}
.day.other .n i{opacity:.35}
.day.ev-class{background:#CFE3FC}
.day.ev-match{background:#FBD3D9}
.day.ev-personal{background:#E4D7FC}
.day.ev-gray{background:#E3E7EC}
.day .n{width:25px;height:23px;border-radius:8px;font-size:14px;line-height:14px}
.day .emo{width:17px;height:17px;margin-top:-3px}
.day{gap:0}
.day .emo .st,.day .emo svg{display:block;width:17px;height:17px}
.day.today .n{background:var(--navy);box-shadow:inset 0 0 0 2.5px var(--lime);padding-top:2px}
.day.today .n i{color:#FFFFFF!important}
.day.sel{box-shadow:none}
.day.sel:not(.today) .n{box-shadow:inset 0 0 0 2px var(--pitch)}
.day.sel:not([class*="ev-"]){background:#FFFFFF}
.legend .lgst svg{display:block;width:16px;height:16px}
.lockline{font-size:12px;color:var(--violet);font-weight:400}

.gate{margin-top:14px;padding:18px}
.gate h2{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 6px}
.gate p{margin:0 0 6px;font-size:14.5px}
details.more{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px}
input,select,textarea{font-size:16px}
</style>

<div id="app"></div>
<script>

(function(){
"use strict";
/* ================= constants ================= */
const TEAM={name:"수지위너스",full:"수지 위너스 풋볼아카데미",className:"유치부 (7세)",addr:"경기도 용인시 수지구 상현동 수지로 18-2",tel:"031-897-6550",mobile:"010-5787-6550",hours:"방문 13:00~20:00 · 일요일·공휴일 휴무",site:"https://sujiwinnersfootball.com/sub",blog:"https://blog.naver.com/ckdrbs74",cafe:"https://cafe.naver.com/sujiwinnersfootball"};
const TYPES={class:'정규 수업',match:'대회·시합',event:'행사',off:'전체 휴강',personal:'개인'};
const TEAM_TYPES=['class','match','off'];
const BALL='<svg class="ball" viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="bc"><circle cx="20" cy="20" r="17.6"/></clipPath></defs><circle cx="20" cy="20" r="17.6" fill="#fff"/><g clip-path="url(#bc)"><path d="M20.00 13.49L26.19 17.99L23.83 25.27L16.17 25.27L13.81 17.99ZM20.00 8.21L13.47 3.47L15.97 -4.21L24.03 -4.21L26.53 3.47ZM31.21 16.36L33.71 8.68L41.78 8.68L44.27 16.36L37.74 21.10ZM26.93 29.54L35.00 29.54L37.49 37.21L30.97 41.96L24.44 37.21ZM13.07 29.54L15.56 37.21L9.03 41.96L2.51 37.21L5.00 29.54ZM8.79 16.36L2.26 21.10L-4.27 16.36L-1.78 8.68L6.29 8.68Z" fill="currentColor"/><path d="M20.00 13.49L20.00 8.21M26.19 17.99L31.21 16.36M23.83 25.27L26.93 29.54M16.17 25.27L13.07 29.54M13.81 17.99L8.79 16.36M26.53 3.47L33.71 8.68M37.74 21.10L35.00 29.54M24.44 37.21L15.56 37.21M5.00 29.54L2.26 21.10M6.29 8.68L13.47 3.47" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><circle cx="20" cy="20" r="17.6" fill="none" stroke="currentColor" stroke-width="2.7"/></svg>';
const ballCls=o=>{const t=o.e.type;return (t==='personal'?'personal':t==='match'||t==='event'?'match':'class')+(o.cancel||t==='off'?' gray':'')};
const ROLES={admin:'관리자',director:'감독',coach:'코치',parent:'부모님',player:'선수'};
const ASSIGNABLE=['director','coach','parent','player'];
const DOW=['일','월','화','수','목','금','토'];
const ICON={음료:'🧃',과일:'🍏',쓰레기:'📦',간식:'🍪',물:'💧'};

/* ================= per-viewer storage ================= */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const L=Object.assign({child:'',checks:{},tab:'cal'},lsGet('sw-local',{}));
function saveL(){lsSet('sw-local',L)}
let PERSONAL=[];
const pKey=()=>'sw-personal:'+(ME.id||'guest');
function loadPersonal(){PERSONAL=lsGet(pKey(),[])}
function savePersonal(){lsSet(pKey(),PERSONAL)}

/* ================= state ================= */
const APPKEY='doa-winners-v1';
let db=null, U=null, dbState='loading';
function myDeviceId(){let id=lsGet(APPKEY+':me',null);if(!id){id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);lsSet(APPKEY+':me',id)}return id}
const ME={id:myDeviceId(),name:'',ready:true};
let EV=[],PL=[],MB=[],PR=[],GR=[],NT=[],RV=[],INV=[];const loaded={events:false,players:false,members:false,profiles:true,groups:false,notices:false,rsvp:false};
let META=null;
const RELS=['엄마','아빠','보호자','선수 본인'];
let role='none', roleAuto=false;
const canManage=()=>role==='admin'||role==='director'||role==='coach';
const isAdmin=()=>role==='admin';
const approved=u=>!!u&&(u.role==='admin'||!u.status||u.status==='approved');
function resolveRole(){const u=MB.find(x=>x.id===ME.id);ME.name=u?u.name||'':'';
  if(!u||!ROLES[u.role]){role='none';return}
  role=u.status==='pending'?'pending':u.status==='rejected'?'rejected':u.role}
const pendingUsers=()=>MB.filter(u=>u.status==='pending').sort((a,b)=>String(a.at).localeCompare(String(b.at)));
loadPersonal();

/* ================= team store: Firebase Realtime Database (REST + EventSource, same as 오늘도 도아 킥) ================= */
const QS=new URLSearchParams(location.search);
let INVITE=(QS.get('invite')||'').toUpperCase();
function otherDb(){for(const k of ['doa-balltouch-v1:sync','doa-math-v1:sync']){try{const o=JSON.parse(localStorage.getItem(k)||'null');if(o&&o.db)return o.db}catch(e){}}return ''}
/* 앱 기본 저장소 — 수지위너스 전용 Firebase 실시간 데이터베이스 */
const DEFAULT_SYNC={db:'https://doa-winners-10163533-default-rtdb.asia-southeast1.firebasedatabase.app',room:'suji-winners'};
let SYNC=(()=>{const q=QS.get('db');if(q&&q.replace(/\/+$/,'')!==DEFAULT_SYNC.db){const c={db:q.replace(/\/+$/,''),room:QS.get('team')||'suji-winners'};lsSet(APPKEY+':sync',c);return c}
  if(q){try{localStorage.removeItem(APPKEY+':sync')}catch(e){}}
  const o=lsGet(APPKEY+':sync',null);return o&&o.db&&o.db!==DEFAULT_SYNC.db&&QS.get('custom')?o:DEFAULT_SYNC})();
if(QS.get('db')){try{history.replaceState(null,'',location.pathname+(INVITE?'?invite='+INVITE:''))}catch(e){}}
let TREE={},es=null,pollT=null;
const base=()=>SYNC.db+'/'+encodeURIComponent(SYNC.room);
function setAt(obj,parts,v){if(!parts.length)return v;obj=(obj&&typeof obj==='object')?obj:{};const k=parts[0];const nv=setAt(obj[k],parts.slice(1),v);if(nv===null||nv===undefined)delete obj[k];else obj[k]=nv;return obj}
const arr=v=>Array.isArray(v)?v.filter(x=>x!=null):(v&&typeof v==='object'?Object.values(v):[]);
const toArr=o=>o&&typeof o==='object'?Object.keys(o).map(k=>Object.assign({},o[k],{id:k})):[];
function syncFromTree(){
  META=TREE.meta||null;EV=toArr(TREE.events);PL=toArr(TREE.players);MB=toArr(TREE.users);GR=toArr(TREE.groups);NT=toArr(TREE.notices);RV=toArr(TREE.rsvp);INV=toArr(TREE.invites);
  EV.forEach(e=>{['items','duties','matches','groupIds'].forEach(k=>{e[k]=arr(e[k])});e.exceptions=e.exceptions||{}});
  PL.forEach(p=>{p.groupIds=arr(p.groupIds)});NT.forEach(n=>{n.groupIds=arr(n.groupIds)});
  for(const k in loaded)loaded[k]=true;
  dbState='ready';resolveRole();renderBg();
}
function onStream(type,e){try{const m=JSON.parse(e.data);if(!m)return;const parts=String(m.path||'/').split('/').filter(Boolean);
  if(type==='put')TREE=setAt(TREE,parts,m.data)||{};else for(const k in (m.data||{}))TREE=setAt(TREE,parts.concat(k.split('/').filter(Boolean)),m.data[k])||{};
  syncFromTree()}catch(x){console.warn(x)}}
function connect(){
  if(!SYNC){dbState='setup';render();return}
  db=true;dbState='loading';render();
  try{es&&es.close()}catch(e){}
  if(pollT){clearInterval(pollT);pollT=null}
  if(window.EventSource){
    es=new EventSource(base()+'.json');
    es.addEventListener('put',e=>onStream('put',e));
    es.addEventListener('patch',e=>onStream('patch',e));
    es.addEventListener('cancel',()=>{dbState='denied';render()});
    es.onerror=()=>{if(dbState!=='ready'){try{es.close()}catch(x){}startPoll()}};
  }else startPoll();
}
function startPoll(){if(pollT)return;const p=()=>fetch(base()+'.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(d=>{TREE=d||{};syncFromTree()}).catch(err=>{if(dbState!=='ready'){dbState=(err===401||err===403)?'denied':'offline';render()}});p();pollT=setInterval(p,15000)}
function clean(o){const c=JSON.parse(JSON.stringify(o));delete c.id;return c}
async function rt(method,path,body){if(!SYNC)throw {code:'offline'};const r=await fetch(base()+(path?'/'+path:'')+'.json',{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw {code:(r.status===401||r.status===403)?'denied':'http'+r.status};return null}
const colKey=p=>p==='members'?'users':p;
async function dbSet(path,id,data){const k=colKey(path),v=clean(data);await rt('PUT',k+'/'+id,v);TREE=setAt(TREE,[k,id],v)||{};syncFromTree()}
async function dbDel(path,id){const k=colKey(path);await rt('DELETE',k+'/'+id);TREE=setAt(TREE,[k,id],null)||{};syncFromTree()}
async function dbPut(path,v){await rt('PUT',path,v);TREE=setAt(TREE,path.split('/').filter(Boolean),v)||{};syncFromTree()}
async function dbPatch(obj){await rt('PATCH','',obj);for(const k in obj)TREE=setAt(TREE,k.split('/').filter(Boolean),obj[k]===null?null:JSON.parse(JSON.stringify(obj[k])))||{};syncFromTree()}
function writeErr(e){
  const c=e&&e.code;
  if(c==='offline')toast('팀 저장소가 연결되지 않았어요');
  else if(c==='denied')toast('저장소 규칙이 쓰기를 막고 있어요. 관리자에게 알려주세요');
  else toast('저장하지 못했어요. 인터넷 연결을 확인해 주세요');
}
let busy=false;
async function run(fn,ok){if(busy)return;busy=true;try{await fn();if(ok)toast(ok)}catch(e){console.warn(e);writeErr(e)}finally{busy=false;render()}}
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function sendNotice(e,date,orig,kind){await dbSet('notices',newId('n'),{eventId:e.id,date,orig,title:e.title,type:e.type,kind,groupIds:e.groupIds||[],sentAt:new Date().toISOString(),sentBy:ME.id||''})}

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=ds(new Date());
const dow=s=>pd(s).getDay();
function fmtDate(s,y){const d=pd(s);return (y?d.getFullYear()+'년 ':'')+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'}
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
function dday(s){const n=Math.round((pd(s)-pd(TODAY))/864e5);return n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
function allEvents(){return EV.filter(canSee).concat(PERSONAL)}
function hasOff(date,ev){const eg=(ev&&ev.groupIds)||[];return EV.some(x=>x.type==='off'&&x.date===date&&(!(x.groupIds||[]).length||!eg.length||x.groupIds.some(g=>eg.includes(g))))}
const isWeekly=e=>e.repeat==='weekly';
function occurs(e,date){return isWeekly(e)&&date>=e.date&&(!e.until||date<=e.until)&&dow(date)===dow(e.date)}
/* occurrence: {e,date,orig,cancel,moved,movedTo,start,end,note} */
function eventsOn(date){
  const out=[];
  for(const e of allEvents()){
    const ex=e.exceptions||{};
    if(isWeekly(e)){
      if(occurs(e,date)){
        const x=ex[date];
        if(x&&x.status==='moved') out.push({e,date,orig:date,cancel:true,movedTo:x.toDate,note:x.note||'',start:e.start,end:e.end});
        else if(x&&x.status==='cancel') out.push({e,date,orig:date,cancel:true,note:x.note||'',start:e.start,end:e.end});
        else out.push({e,date,orig:date,cancel:hasOff(date,e),offDay:hasOff(date,e),start:e.start,end:e.end});
      }
      for(const k in ex){const x=ex[k]; if(x.status==='moved'&&x.toDate===date) out.push({e,date,orig:k,moved:true,note:x.note||'',start:x.toStart||e.start,end:x.toEnd||e.end});}
    }else if(e.date===date) out.push({e,date,orig:date,start:e.start,end:e.end});
  }
  const t=o=>o.e.gather||o.start||'99';
  return out.sort((a,b)=>t(a).localeCompare(t(b)));
}
function range(from,to){const r=[];for(let d=from;d<=to;d=addDays(d,1))r.push(...eventsOn(d));return r}
function findEv(id){return EV.concat(PERSONAL).find(e=>e.id===id)}
function findOcc(id,date,orig){return eventsOn(date).find(o=>o.e.id===id&&(!orig||o.orig===orig))}

/* ================= view state ================= */
const now=new Date();
let V={y:now.getFullYear(),m:now.getMonth(),sel:TODAY,tab:L.tab||'cal',sheet:null,mb:{confirm:null},ob:{code:''}};
function resolveNames(){}
const nameOf=id=>{const u=MB.find(x=>x.id===id);return (u&&u.name)||(id===ME.id?'나':'이름 없음')};

/* ================= utils ================= */
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2800)}
const svg={
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>',
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5l-2.5 4M8 10L3.5 8.5"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
};
function linkOf(id){const u=MB.find(x=>x.id===id);return u&&u.playerId?{playerId:u.playerId,relation:u.relation||'',by:'self'}:null}
function myLink(){return linkOf(ME.id)}
function relLabel(l){const p=l&&PL.find(x=>x.id===l.playerId);if(!p)return '';return l.relation==='선수 본인'?p.name+' 선수 본인':p.name+(l.relation?' '+l.relation:' 가족')}
function childName(){const l=myLink();if(l){const p=PL.find(x=>x.id===l.playerId);if(p)return p.name}return ''}

/* ================= groups · visibility · notices · RSVP ================= */
const JOIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.6"/><path d="M3 20c.8-3.6 3.4-5.6 6.5-5.6s5.7 2 6.5 5.6"/><path d="M19 8v6M16 11h6"/></svg>';

const CLASS_ST=['ball','boot','jersey','medal'];
function stickerFor(k,d){if(k==='match')return STK.trophy;if(k==='personal')return STK.star;if(k==='gray')return STK.ballgray;return STK[CLASS_ST[Math.floor((d.getDate()-1)/7)%4]]}
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>';
const RS={yes:'참석',no:'불참',maybe:'미정'};
const KIND={new:'새 일정',update:'일정 안내',change:'일정 변경',cancel:'휴강 안내'};
const gName=id=>{const g=GR.find(x=>x.id===id);return g?g.name:''};
const sortedGroups=()=>GR.slice().sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name)));
const groupsLabel=ids=>(ids&&ids.length)?(ids.map(gName).filter(Boolean).join(', ')||'삭제된 그룹'):'전체 팀';
const byNum=(a,b)=>(+a.number||999)-(+b.number||999)||String(a.name).localeCompare(String(b.name));
function myPlayer(){const l=myLink();return l?PL.find(p=>p.id===l.playerId)||null:null}
function meU(){return MB.find(x=>x.id===ME.id)||{}}
function staffGroups(u){return arr((u||{}).groupIds)}
function myGroups(){if(isAdmin())return GR.map(g=>g.id);if(canManage())return staffGroups(meU());const p=myPlayer();return p?(p.groupIds||[]):[]}
function visibleGroups(){const m=myGroups();return sortedGroups().filter(g=>isAdmin()||m.includes(g.id))}
function canSee(e){
  if(e.type==='personal') return true;
  const gs=e.groupIds||[];
  if(isAdmin()) return true;
  if(!gs.length) return true;
  const mine=myGroups(); return gs.some(g=>mine.includes(g));
}
function playersIn(ids){return PL.filter(p=>!ids||!ids.length||(p.groupIds||[]).some(g=>ids.includes(g)))}
function familyOf(pid){const ids=new Set(MB.filter(approved).map(x=>x.id));return [...ids].filter(id=>{const l=linkOf(id);return l&&l.playerId===pid})}
function familyCount(gids){let n=0;playersIn(gids).forEach(p=>n+=familyOf(p.id).length);return n}
const occKey=(id,date)=>id+'@'+date;
function myRsvp(key){const r=RV.find(x=>x.id===ME.id);return r&&r.answers&&r.answers[key]}
function rsvpFor(pid,key){let best=null;for(const r of RV){const cands=[r.answers&&r.answers[key],r.marks&&r.marks[key]&&r.marks[key][pid]&&Object.assign({p:pid,by:r.id},r.marks[key][pid])];for(const a of cands){if(a&&a.p===pid&&!a.staff&&(!best||String(a.at)>String(best.at)))best=Object.assign({by:a.by||r.id},a)}}return best}
const STAFF=['admin','director','coach'];
function staffAnswers(key){return RV.map(r=>({id:r.id,a:r.answers&&r.answers[key]})).filter(x=>x.a&&x.a.staff)}
function rsvpButtons(key,cur,past,extra){return `${cur?'':`<p class="ask">${past?'지난 일정이에요':'아직 답하지 않았어요 · 아래에서 골라주세요'}</p>`}<div class="rsvp ${cur?'answered':'pending'}">${['yes','no','maybe'].map(x=>`<button type="button" data-rsvp="${x}" data-key="${h(key)}" ${extra||''} aria-pressed="${cur===x}" class="r-${x}" ${past?'disabled':''}>${cur===x?'✓ ':''}${RS[x]}</button>`).join('')}</div>`}
function myNotices(){
  if(canManage()) return [];
  const mine=myGroups();
  return NT.filter(n=>{const gs=n.groupIds||[];return !gs.length||gs.some(g=>mine.includes(g))}).sort((a,b)=>String(b.sentAt).localeCompare(String(a.sentAt)));
}
function unreadCount(){const seen=L.seen||{};return myNotices().filter(n=>!seen[n.id]&&n.date>=addDays(TODAY,-1)).length}
function bellBtn(){if(isAdmin()&&dbState==='ready'){const n=pendingUsers().length;return `<button class="bell ${n?'hot':''}" id="apOpen" aria-label="가입 신청 ${n}명" title="가입 신청">${JOIN}${n>1?`<span class="badge">${n}</span>`:''}</button>`}if(canManage()||dbState!=='ready')return '';const n=unreadCount();return `<button class="bell ${n?'hot':''}" id="bell" aria-label="알림 ${n}개">${BELL}${n?`<span class="badge">${n}</span>`:''}</button>`}
function playerCard(p,child){
  const fam=familyOf(p.id).filter(id=>{const l=linkOf(id);return l&&l.relation!=='선수 본인'});
  return `<button class="player ${child&&p.name===child?'mine':''}" ${canManage()?`data-pedit="${h(p.id)}"`:'disabled'}><span class="num">${h(p.number||'–')}</span><div><strong>${h(p.name)}</strong><small>${fam.length?'가족 '+fam.length+'명 연결':'가족 미연결'}</small></div></button>`;
}
function groupsHtml(child){
  const gs=sortedGroups();
  if(!gs.length&&!PL.length) return `<div class="empty-box">${dbState==='ready'&&!loaded.groups?'불러오는 중이에요':'아직 그룹이 없어요'}${canManage()?'<span>7세 선수반, 7세 취미반처럼 그룹을 먼저 만들고 선수를 등록하세요</span><button class="btn primary" id="addGroup2">+ 첫 그룹 만들기</button>':''}</div>`;
  const vis=visibleGroups();
  let out=vis.map(g=>{const ps=PL.filter(p=>(p.groupIds||[]).includes(g.id)).sort(byNum);
    return `<div class="gcard"><div class="ghead"><b>${h(g.name)}</b><span class="hint">${ps.length}명</span>${canManage()?`<button class="btn sm" data-gadd="${h(g.id)}">+ 선수</button><button class="iconbtn sm" data-gedit="${h(g.id)}" aria-label="그룹 이름 수정">✎</button>`:''}</div>
    ${ps.length?`<div class="roster">${ps.map(p=>playerCard(p,child)).join('')}</div>`:'<p class="hint" style="margin:0">아직 선수가 없어요</p>'}</div>`}).join('');
  const none=PL.filter(p=>!(p.groupIds||[]).filter(gName).length);
  if(canManage()&&none.length) out+=`<div class="gcard"><div class="ghead"><b>그룹 미지정</b><span class="hint">${none.length}명</span></div><div class="roster">${none.sort(byNum).map(p=>playerCard(p,child)).join('')}</div></div>`;
  if(!canManage()&&!vis.length) out=`<div class="empty-box">'내 정보'에서 우리 아이를 연결하면 아이가 속한 그룹이 보여요</div>`;
  return out;
}
function audienceHtml(e,o){
  const key=occKey(e.id,o.date),past=o.date<TODAY;
  let html=`<section class="sec"><h3>${IC.users}참여 <span class="sec-sub">${h(groupsLabel(e.groupIds))}</span></h3>`;
  if(canManage()){
    const ps=playersIn(e.groupIds).sort(byNum);
    const st=ps.map(p=>({p,a:rsvpFor(p.id,key)}));
    const c={yes:0,no:0,maybe:0,none:0};st.forEach(x=>c[x.a?x.a.s:'none']++);
    const sent=NT.filter(n=>n.eventId===e.id&&n.date===o.date).sort((a,b)=>String(b.sentAt).localeCompare(String(a.sentAt)))[0];
    html+=`<div class="rsum"><span class="r-yes">참석 ${c.yes}</span><span class="r-no">불참 ${c.no}</span><span class="r-maybe">미정 ${c.maybe}</span><span class="r-none">미응답 ${c.none}</span></div>
    ${ps.length?`<div class="rlist">${st.map(x=>`<div class="rrow"><span>${h(x.p.number?x.p.number+'번 ':'')}${h(x.p.name)}${x.a&&x.a.by&&x.a.by!==ME.id&&STAFF.includes((MB.find(m=>m.id===x.a.by)||{}).role)?' <small class="hint">코치 체크</small>':''}</span><select class="mark r-${x.a?x.a.s:'none'}" id="mk-${h(x.p.id)}" data-mark="${h(x.p.id)}" data-key="${h(key)}" aria-label="${h(x.p.name)} 참석 여부"><option value="" ${x.a?'':'selected'}>미응답</option>${['yes','no','maybe'].map(v=>`<option value="${v}" ${x.a&&x.a.s===v?'selected':''}>${RS[v]}</option>`).join('')}</select></div>`).join('')}</div><p class="hint" style="margin:6px 0 0">선수 참석 여부를 감독·코치가 직접 체크할 수 있어요. 부모님 응답과 코치 체크 중 나중 것이 반영돼요.</p>`:'<p class="hint" style="margin:0">대상 그룹에 등록된 선수가 없어요</p>'}
    ${(()=>{const sa=staffAnswers(key);resolveNames(sa.map(x=>x.id));const mine=myRsvp(key);
      return `<div class="staffbox"><h4>감독·코치 참여</h4>${sa.length?`<div class="rlist">${sa.map(x=>`<div class="rrow"><span>${h(nameOf(x.id))}${x.id===ME.id?' (나)':''}</span><b class="r-${x.a.s}">${RS[x.a.s]}</b></div>`).join('')}</div>`:'<p class="hint" style="margin:0 0 6px">아직 응답한 감독·코치가 없어요</p>'}
      <p style="margin:8px 0 6px;font-size:14px"><b>나의 참여</b></p>${rsvpButtons(key,mine&&mine.staff?mine.s:'',past,'data-staff="1"')}</div>`})()}
    <p class="hint" style="margin:8px 0 0">${sent?'공지 보냄 · '+h(new Date(sent.sentAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})):'아직 공지를 보내지 않았어요. 공지를 보내야 선수·부모님 알림에 떠요'}</p>
    ${past?'':`<button class="btn primary" id="notify" data-id="${h(e.id)}" data-date="${o.date}" data-orig="${o.orig}" style="margin-top:8px;width:100%">${sent?'다시 공지 보내기':'공지 보내기'} · 선수·부모님 ${familyCount(e.groupIds)}명</button>`}`;
  }else{
    const p=myPlayer();
    if(!p) html+=`<p class="hint" style="margin:0">'내 정보'에서 우리 아이를 연결하면 참여 여부를 답할 수 있어요.</p>`;
    else if(o.cancel) html+=`<p class="hint" style="margin:0">휴강이라 답하지 않아도 돼요.</p>`;
    else{const a=myRsvp(key);const cur=a?a.s:'';
      html+=`<p style="margin:0 0 8px"><b>${h(p.name)}</b> 참여하나요?</p>${rsvpButtons(key,cur,past)}${(()=>{const f=rsvpFor(p.id,key);return f&&(!a||String(f.at)>String(a.at))&&f.by!==ME.id?`<p class="hint" style="margin:6px 0 0">감독·코치님이 <b>${RS[f.s]}</b>(으)로 체크했어요</p>`:a?`<p class="hint" style="margin:6px 0 0">${RS[a.s]}(으)로 답했어요. 감독·코치님께 보여요</p>`:''})()}`}
  }
  return html+'</section>';
}
function approvalRows(){
  const ps=pendingUsers();
  if(!ps.length) return '<div class="empty-box">기다리는 가입 신청이 없어요</div>';
  return `<div class="list">${ps.map(u=>{const l=linkOf(u.id);return `<div class="card" style="margin-top:0"><div class="member" style="border:0;padding:0"><div class="nm"><strong>${h(u.name||'이름 없음')}</strong><small>${ROLES[u.role]}${l&&relLabel(l)?' · '+h(relLabel(l)):' · 아이 미선택'} · ${h(new Date(u.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</small></div></div>
    <div class="actions"><button class="btn danger" data-aprej="${h(u.id)}">거절</button><button class="btn primary" data-apok="${h(u.id)}">승인</button></div></div>`}).join('')}</div>`;
}
function approvalsHtml(){return `<div class="sheet-head"><h2>가입 승인</h2><button class="iconbtn" data-close aria-label="닫기">✕</button></div><p class="hint">부모님·선수가 가입하면 여기로 와요. 승인해야 앱을 볼 수 있어요. 초대 링크로 들어온 사람은 바로 열려요.</p>${approvalRows()}`}
function inboxHtml(){
  const ns=myNotices().slice(0,40),seen=L.seen||{};

function kitColor(txt){for(const [re,c,n] of KIT_COLORS)if(re.test(txt))return {c,n};return null}
function shirtSvg(c){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.3 2.2L4 4.6L1.6 10L5.5 11.6V21.6H18.5V11.6L22.4 10L20 4.6L14.7 2.2L12 4.9Z" fill="${c}" stroke="#5A6878" stroke-width="${c==='#FFFFFF'?1.2:0}" stroke-linejoin="round"/><path d="M9.3 2.2L12 4.9L14.7 2.2" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/></svg>`}
function sockSvg(c){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h7.5v10.2l3.3 3.6a3.6 3.6 0 0 1-.2 5.1l-.2.2a3.6 3.6 0 0 1-5 0L8 15.6z" fill="${c}" stroke="#5A6878" stroke-width="${c==='#FFFFFF'?1.2:0}" stroke-linejoin="round"/><path d="M8 5h7.5M8 7.4h7.5" stroke="rgba(255,255,255,.7)" stroke-width="1.2"/></svg>`}
function kitHtml(u){
  const parts=[];let rest=u;
  const m1=u.match(/([^\s+,/·]+)\s*(유니폼|상의|저지)/);const m2=u.match(/([^\s+,/·]+)\s*(스타킹|양말|삭스)/);
  if(m1){const k=kitColor(m1[1]);parts.push(`<span class="kit">${shirtSvg(k?k.c:'#12558A')}<b>${h(m1[1]+' '+m1[2])}</b></span>`);rest=rest.replace(m1[0],'')}
  if(m2){const k=kitColor(m2[1]);parts.push(`<span class="kit">${sockSvg(k?k.c:'#12558A')}<b>${h(m2[1]+' '+m2[2])}</b></span>`);rest=rest.replace(m2[0],'')}
  rest=rest.replace(/^[\s+,/·]+|[\s+,/·]+$/g,'').replace(/^\(|\)$/g,'').trim();
  if(!parts.length) return `<p class="sec-line">${h(u)}</p>`;
  return `<div class="kits">${parts.join('')}</div>${rest?`<p class="hint" style="margin:8px 0 0">${h(rest)}</p>`:''}`;
}
function notesHtml(t){
  const BUL=/^\s*([•·∙\-–\*※✔✓✅☑▶►▸◆◇○●■□★☆♥]|\d{1,2}[.)])\s*(.*)$/;
  return `<div class="notes2">${String(t).split('\n').map(l=>{
    if(!l.trim()) return '<div class="gap"></div>';
    if(/^\s*\[.+\]\s*$/.test(l)) return `<div class="nh">${h(l.trim().replace(/^\[|\]$/g,''))}</div>`;
    const m=l.match(BUL); if(m) return `<div class="li"><span class="bu">${h(m[1])}</span><span class="lt">${h(m[2])}</span></div>`;
    return `<p>${h(l)}</p>`}).join('')}</div>`;
}

/* ================= kakao notice parser ================= */
function parseTime(s){
  const m=String(s).match(/(am|pm|오전|오후)?\s*(\d{1,2})\s*[:시]\s*(\d{2})?/i);if(!m)return '';
  let hh=+m[2];const mm=m[3]?+m[3]:0;const ap=(m[1]||'').toLowerCase();
  if((ap==='pm'||ap==='오후')&&hh<12)hh+=12;if((ap==='am'||ap==='오전')&&hh===12)hh=0;
  return hh<24?pad(hh)+':'+pad(mm):'';
}
function parseKakao(text){
  const out={};const notes=[];let last=null;
  const KEY=/^(장소|주차|일자|날짜|일시|집결\s*시간|집결|경기\s*시간|시간|예상\s*날씨|날씨|유니폼|복장|개인\s*준비물|준비물)\s*[:：]\s*(.*)$/;
  const DUTY=/^(음료|과일|쓰레기|간식|물)\s*[-:：]\s*([가-힣A-Za-z]{2,5})\s*(\(.*\))?\s*$/;
  for(const raw of text.replace(/\r/g,'').split('\n')){
    const line=raw.replace(/^[^\p{L}\p{N}<(\[]+/u,'').trim();
    if(!line){last=null;continue}
    const t=line.match(/^<\s*(.+?)\s*>$/);if(t&&!out.title){out.title=t[1];continue}
    const k=line.match(KEY);
    if(k){const key=k[1].replace(/\s/g,''),v=k[2].trim();
      if(key==='장소'){out.place=v;last='place'}
      else if(key==='주차'){out.parking=v;last='parking'}
      else if(/일자|날짜|일시/.test(key)){const d=v.match(/(\d{2,4})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{1,2})/);if(d){const y=d[1].length===2?'20'+d[1]:d[1];out.date=y+'-'+pad(d[2])+'-'+pad(d[3])}last=null}
      else if(key.startsWith('집결')){out.gather=parseTime(v);last=null}
      else if(/시간/.test(key)){const ps=v.split(/[-~–]/);out.start=parseTime(ps[0]);if(ps[1]){let en=ps[1];if(!/am|pm|오전|오후/i.test(en)&&/pm|오후/i.test(ps[0]))en='pm'+en;out.end=parseTime(en);if(out.end&&out.start&&out.end<out.start){const hh=+out.end.slice(0,2)+12;if(hh<24)out.end=pad(hh)+out.end.slice(2)}}last=null}
      else if(/날씨/.test(key)){out.weather=v;last='weather'}
      else if(/유니폼|복장/.test(key)){out.uniform=v;last='uniform'}
      else if(/준비물/.test(key)){out.items=v.split(/[,，、]/).map(x=>x.replace(/등[\s,.]*$|\.+$/g,'').trim()).filter(Boolean);last='items'}
      continue}
    const d=line.match(DUTY);
    if(d){(out.duties=out.duties||[]).push({role:d[1],who:d[2],memo:(d[3]||'').replace(/준비해\s*주시면.*$/,'').replace(/[()❣️]/g,' ').replace(/\s+/g,' ').trim()});last=null;continue}
    if(last&&(/^\s/.test(raw)||/^\(/.test(line)||/^📌/.test(raw.trim()))){
      const v=/^\(/.test(line)?line.replace(/^\(|\)$/g,''):line;
      if(last==='place'&&/^\(/.test(line))out.addr=v;
      else if(last==='items')out.items.push(...v.split(',').map(x=>x.trim()).filter(Boolean));
      else out[last]=(out[last]?out[last]+' · ':'')+v;
      continue}
    last=null;notes.push(line);
  }
  if(notes.length)out.notes=notes.join('\n');
  return out;
}
function shareText(o){
  const e=o.e,d=pd(o.date),T=[];
  const ap=t=>{const [hh,mm]=t.split(':').map(Number);return (hh<12?'am':'pm')+((hh%12)||12)+':'+pad(mm)};
  T.push('<'+e.title+'>','');
  if(o.movedTo){T.push('📌'+fmtDate(o.date)+' 수업이 '+fmtDate(o.movedTo)+'로 변경됐어요'+(o.note?' ('+o.note+')':''));return T.join('\n')}
  if(o.cancel){T.push('📌'+fmtDate(o.date)+' 수업은 휴강입니다'+(o.note?' ('+o.note+')':''));return T.join('\n')}
  if(o.moved)T.push('📌'+fmtDate(o.orig)+' 수업이 이 날로 변경됐어요','');
  if(e.place){T.push('✅장소: '+e.place);if(e.addr)T.push('       ('+e.addr+')');T.push('')}
  if(e.parking)T.push('🚙주차: '+e.parking,'');
  T.push('✅일자: '+String(d.getFullYear()).slice(2)+'. '+(d.getMonth()+1)+'. '+d.getDate()+'('+DOW[d.getDay()]+')','');
  if(e.gather)T.push('✅집결시간: '+ap(e.gather),'');
  if(o.start)T.push('✅'+(e.type==='match'?'경기':'수업')+'시간: '+ap(o.start)+(o.end?'-'+o.end:''),'');
  if(e.weather)T.push('✅예상 날씨: '+e.weather,'');
  if(e.uniform)T.push('✅유니폼: '+e.uniform,'');
  if((e.items||[]).length)T.push('✅개인 준비물: '+e.items.join(', '),'');
  if((e.matches||[]).length){T.push('⚽우리 팀 경기');e.matches.forEach(m=>T.push('  '+m.time+' '+m.field+' '+(/^순위|위전|결승/.test(m.opp)?'':'vs ')+m.opp+(m.score?' ('+m.score+')':'')));T.push('')}
  (e.duties||[]).forEach(x=>T.push((ICON[x.role]||'⭐')+x.role+'- '+x.who+(x.memo?' ('+x.memo+')':'')));
  if((e.duties||[]).length)T.push('');
  if(e.notes)T.push(e.notes);
  return T.join('\n').replace(/\n{3,}/g,'\n\n').trim();

const val=id=>{const el=document.getElementById(id);return el?el.value.trim():null};
function readForm(){
  const d=V.sheet.draft;
  const type=(document.querySelector('input[name="f-type"]:checked')||{}).value||d.type;
  const pick=(id,k)=>{const v=val(id);return v===null?d[k]:v};
  const lines=id=>{const v=val(id);return v===null?null:v.split('\n')};
  const f={type,title:pick('f-title','title'),date:pick('f-date','date'),gather:pick('f-gather','gather'),start:pick('f-start','start'),end:pick('f-end','end'),until:pick('f-until','until'),
    place:pick('f-place','place'),addr:pick('f-addr','addr'),parking:pick('f-parking','parking'),uniform:pick('f-uniform','uniform'),weather:pick('f-weather','weather'),notes:(document.getElementById('f-notes')||{value:d.notes}).value.replace(/\s+$/,'')};
  const it=val('f-items');f.items=it===null?d.items:it.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
  const du=lines('f-duties');f.duties=du===null?d.duties:du.map(l=>l.split(/\s*-\s*/)).filter(p=>p[0]&&p[1]).map(p=>({role:p[0].trim(),who:p[1].trim(),memo:p.slice(2).join(' - ').trim()}));
  const ma=lines('f-matches');f.matches=ma===null?d.matches:ma.map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]).map(p=>({time:p[0]||'',field:p[1]||'',opp:p[2]||'',score:p[3]||''}));
  const gb=document.querySelectorAll('input[name="f-g"]');f.groupIds=gb.length?[...gb].filter(x=>x.checked).map(x=>x.value):(d.groupIds||[]);
  f.repeat=type==='class'?'weekly':'';
  if(type!=='class')f.until='';
  if(type==='class'){f.gather=f.gather||'';}
  return f;
}

    if(visibleGroups().length&&!f.groupIds.length){toast('대상 그룹을 하나 이상 골라주세요');return}
    const d=V.sheet.draft;const editing=V.sheet.editing&&d.id;const id=editing?d.id:newId('e');
    const doc=Object.assign({},editing?findEv(id):{},f,{exceptions:editing?(findEv(id).exceptions||{}):{},updatedAt:new Date().toISOString(),updatedBy:ME.id||''});
    if(!editing){doc.createdBy=ME.id||''}
    const nd=pd(f.date);V.y=nd.getFullYear();V.m=nd.getMonth();V.sel=f.date;V.tab='cal';V.sheet={kind:'detail',id,date:f.date,orig:f.date};
    if(act==='notify') run(async()=>{await dbSet('events',id,doc);await sendNotice(Object.assign({},doc,{id}),f.date,f.date,editing?'update':'new')},'저장하고 '+groupsLabel(f.groupIds)+'에 공지를 보냈어요');
    else run(()=>dbSet('events',id,doc),'저장했어요. 공지는 보내지 않았어요');return}
  if(id0==='pForm'){
    const d=V.sheet.draft;const f={id:d.id||newId('p'),type:'personal',title:val('p-title'),date:val('p-date'),start:val('p-start'),end:val('p-end'),place:val('p-place'),items:val('p-items').split(',').map(x=>x.trim()).filter(Boolean),notes:document.getElementById('p-notes').value,repeat:''};
    if(!f.title||!f.date){toast('제목과 날짜를 넣어주세요');return}
    const i=PERSONAL.findIndex(x=>x.id===f.id);if(i>=0)PERSONAL[i]=f;else PERSONAL.push(f);savePersonal();
    const nd=pd(f.date);V.y=nd.getFullYear();V.m=nd.getMonth();V.sel=f.date;V.sheet={kind:'detail',id:f.id,date:f.date,orig:f.date};render();toast('개인 일정을 저장했어요 (나만 보기)');return}
  if(id0==='moveForm'){
    const s=V.sheet;const e=findEv(s.id);const ex=Object.assign({},e.exceptions||{});
    const toDate=val('mv-date');if(!toDate){toast('바뀐 날짜를 넣어주세요');return}
    ex[s.orig]={status:'moved',toDate,toStart:val('mv-start'),toEnd:val('mv-end'),note:val('mv-note')};
    V.sheet={kind:'detail',id:e.id,date:toDate,orig:s.orig};
    const ne=Object.assign({},e,{exceptions:ex});
    if(act==='notify') run(async()=>{await dbSet('events',e.id,ne);await sendNotice(ne,s.orig,s.orig,'change')},md(s.orig)+' 수업을 '+md(toDate)+'로 옮기고 공지를 보냈어요');
    else run(()=>dbSet('events',e.id,ne),md(s.orig)+' 수업을 '+md(toDate)+'로 옮겼어요');return}
  if(id0==='gForm'){
    if(!canManage()){toast('그룹은 감독·코치만 만들 수 있어요');return}
    const d=V.sheet.draft;const name=val('g-name');if(!name){toast('그룹 이름을 넣어주세요');return}
    const id=d.id||newId('g');V.sheet=null;const patch={};patch['groups/'+id]={name,order:d.order||GR.length+1};
    if(!d.id&&!isAdmin()){patch['users/'+ME.id+'/groupIds']=staffGroups(meU()).concat(id)}
    run(()=>dbPatch(patch),name+' 그룹을 저장했어요');return}
  if(id0==='plForm'){
    if(!canManage()){toast('선수 등록은 감독·코치만 할 수 있어요');return}
    const d=V.sheet.draft;const gids=[...document.querySelectorAll('input[name="pl-g"]:checked')].map(x=>x.value);const p={name:val('pl-name'),number:val('pl-number'),birth:val('pl-birth'),groupIds:gids,memo:val('pl-memo'),updatedBy:ME.id||''};
    if(GR.length&&!gids.length){toast('그룹을 하나 이상 골라주세요');return}
    if(!p.name){toast('이름을 넣어주세요');return}
    const id=d.id||newId('pl');V.sheet=null;run(()=>dbSet('players',id,p),p.name+' 선수를 저장했어요');return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&V.sheet){V.sheet=null;render()}});
render();connect();
})();
</script>
</body>
</html>
